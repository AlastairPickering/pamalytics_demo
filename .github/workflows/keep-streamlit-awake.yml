
name: Keep Streamlit apps awake

on:
  schedule:
    # Visit both apps every 4 hours
    - cron: "17 */4 * * *"

  # Allow manual testing from the GitHub Actions page
  workflow_dispatch:

jobs:
  visit-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit both Streamlit apps
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          urls = [
              "https://forest-viewer.streamlit.app/",
              "https://pamalytics-demo.streamlit.app/",
          ]

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)

              for url in urls:
                  page = browser.new_page()
                  print(f"Opening {url}", flush=True)

                  try:
                      page.goto(
                          url,
                          wait_until="domcontentloaded",
                          timeout=120_000,
                      )

                      page.wait_for_timeout(5_000)

                      wake_button = page.get_by_role(
                          "button",
                          name=re.compile(
                              r"get this app back up|wake",
                              re.IGNORECASE,
                          ),
                      )

                      if wake_button.count() > 0 and wake_button.first.is_visible():
                          print(f"App sleeping. Waking {url}", flush=True)
                          wake_button.first.click()

                      page.wait_for_selector(
                          '[data-testid="stAppViewContainer"]',
                          state="visible",
                          timeout=180_000,
                      )

                      page.wait_for_function(
                          """() => {
                              const app = document.querySelector(
                                  '[data-testid="stAppViewContainer"]'
                              );
                              return app && app.innerText.trim().length > 0;
                          }""",
                          timeout=180_000,
                      )

                      page.wait_for_timeout(15_000)

                      print(
                          f"SUCCESS: App loaded at {page.url}",
                          flush=True,
                      )

                  finally:
                      page.close()

              browser.close()
          PY
