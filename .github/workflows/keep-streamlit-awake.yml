
name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  visit-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit and wake Streamlit apps
        run: |
          python - <<'PY'
          import re
          import time
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright

          apps = {
              "forest-viewer": "https://forest-viewer.streamlit.app/",
              "pamalytics-demo": "https://pamalytics-demo.streamlit.app/",
          }

          Path("diagnostics").mkdir(exist_ok=True)
          failures = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)

              for name, url in apps.items():
                  page = browser.new_page()
                  print(f"\nChecking {name}", flush=True)

                  try:
                      page.goto(
                          url,
                          wait_until="domcontentloaded",
                          timeout=120000,
                      )

                      started = time.monotonic()
                      loaded = False
                      wake_clicks = 0

                      while time.monotonic() - started < 180:

                          for frame in page.frames:
                              wake = frame.get_by_role(
                                  "button",
                                  name=re.compile(
                                      "get this app back up",
                                      re.I,
                                  ),
                              )

                              if wake.count() and wake.first.is_visible():
                                  print("Sleeping app detected", flush=True)
                                  wake.first.click(timeout=15000)
                                  wake_clicks += 1
                                  print("Wake-up requested", flush=True)
                                  break

                          for frame in page.frames:
                              app = frame.locator(
                                  '[data-testid="stAppViewContainer"]'
                              )

                              if app.count() and app.first.is_visible():
                                  content = app.first.inner_text(timeout=5000)

                                  if len(content.strip()) > 20:
                                      loaded = True
                                      break

                          if loaded:
                              break

                          elapsed = int(time.monotonic() - started)

                          if elapsed % 30 < 5:
                              print(
                                  f"{name}: waiting ({elapsed}s)",
                                  flush=True,
                              )

                          page.wait_for_timeout(5000)

                      if not loaded:
                          raise RuntimeError(
                              "Streamlit content was not detected"
                          )

                      print(
                          f"SUCCESS: {name} loaded "
                          f"(wake clicks: {wake_clicks})",
                          flush=True,
                      )

                      page.wait_for_timeout(20000)

                  except Exception as error:
                      print(f"FAILED: {name}: {error}", flush=True)

                      parts = urlsplit(page.url)
                      print(
                          f"Final page: {parts.scheme}://"
                          f"{parts.netloc}{parts.path}",
                          flush=True,
                      )

                      try:
                          print(
                              "Page text:\n"
                              + page.locator("body").inner_text()[:1500],
                              flush=True,
                          )

                          print(
                              "Visible buttons:",
                              page.locator("button").all_inner_texts()[:20],
                              flush=True,
                          )

                          page.screenshot(
                              path=f"diagnostics/{name}.png",
                              full_page=True,
                          )

                      except Exception as diagnostic_error:
                          print(
                              f"Diagnostic error: {diagnostic_error}",
                              flush=True,
                          )

                      failures.append(name)

                  finally:
                      page.close()

              browser.close()

          if failures:
              raise SystemExit(
                  "Apps failed: " + ", ".join(failures)
              )

          print("\nBoth Streamlit apps loaded successfully.")
          PY

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
