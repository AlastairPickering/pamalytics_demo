name: Keep Streamlit apps awake

on:
  schedule:
    # Visit both apps every 8 hours
    - cron: "17 */8 * * *"

  # Allow manual testing from the GitHub Actions page
  workflow_dispatch:

jobs:
  visit-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit both Streamlit apps
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          urls = [
              "https://forest-viewer.streamlit.app/",
              "https://pamalytics-demo.streamlit.app/",
          ]

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)

              for url in urls:
                  page = browser.new_page()
                  print(f"Opening {url}")

                  page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=120_000,
                  )

                  # Give Streamlit time to establish its WebSocket session
                  page.wait_for_timeout(30_000)

                  print(f"Successfully visited {page.url}")
                  page.close()

              browser.close()
          PY